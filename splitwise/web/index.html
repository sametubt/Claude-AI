<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>splitwise · settlement</title>
<meta name="description" content="Who paid for what, and who pays who. A shareable settlement dashboard." />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Splitwise" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Cpath d='M18 36c5 8 23 8 28 0M22 24h.01M42 24h.01' stroke='%23fff' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%237c5cff'/%3E%3Cpath d='M50 110c14 22 66 22 80 0M62 70h.01M118 70h.01' stroke='%23fff' stroke-width='11' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg-0:#0b0d12;
    --bg-1:#11141b;
    --bg-2:#171a23;
    --bg-3:#1f2330;
    --line:#272c3a;
    --text:#e8ecf5;
    --muted:#8a93a8;
    --muted-2:#5b6379;
    --accent:#7c5cff;
    --accent-2:#5b8cff;
    --good:#34d399;
    --bad:#fb7185;
    --warn:#fbbf24;
    --radius:18px;
    --shadow-lg:0 30px 80px -20px rgba(0,0,0,.55), 0 8px 20px -10px rgba(0,0,0,.4);
    --shadow-sm:0 4px 14px -6px rgba(0,0,0,.5);
    --font:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);color:var(--text);
    background:
      radial-gradient(1200px 800px at 85% -10%, rgba(124,92,255,.25), transparent 60%),
      radial-gradient(900px 600px at -10% 10%, rgba(91,140,255,.18), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(52,211,153,.10), transparent 60%),
      var(--bg-0);
    min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5;
  }
  .wrap{
    max-width:780px;margin:0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(60px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
  }
  header.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;box-shadow:var(--shadow-sm);
  }
  .logo svg{width:24px;height:24px}
  .title{min-width:0}
  .title h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:700;line-height:1.2;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .title .sub{color:var(--muted);font-size:13px;margin-top:2px;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--bg-2);
    color:var(--text);font:inherit;font-size:14px;font-weight:500;
    padding:10px 14px;border-radius:10px;cursor:pointer;min-height:42px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
    -webkit-tap-highlight-color:transparent;flex-shrink:0;
  }
  .btn:hover{background:var(--bg-3);border-color:#333a4d}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent;color:#fff;
    box-shadow:0 10px 22px -10px rgba(124,92,255,.7);
  }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), var(--bg-1);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow-lg);overflow:hidden;margin-bottom:18px;
  }
  .card-head{
    padding:18px 22px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  }
  .card-head h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .card-head .meta{color:var(--muted);font-size:13px}
  .card-body{padding:8px 22px 22px}

  /* Settlement card (the hero result) */
  .settle-card{
    background:linear-gradient(160deg, rgba(124,92,255,.14), rgba(91,140,255,.05) 60%, var(--bg-1));
    border:1px solid rgba(124,92,255,.32);
  }
  .settle-card .card-head h2{color:#c8b8ff}
  .transfers{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .transfer{
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    padding:14px 16px;border:1px solid var(--line);border-radius:12px;
    background:var(--bg-2);
  }
  .transfer .flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .transfer .who{font-weight:700;font-size:15px}
  .transfer .arrow{color:var(--muted);display:inline-flex}
  .transfer .arrow svg{width:18px;height:18px}
  .transfer .amt{
    font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;
    color:#dcd3ff;white-space:nowrap;
  }
  .settle-note{margin-top:12px;color:var(--muted);font-size:13px}
  .all-even{
    text-align:center;padding:22px 16px;color:var(--good);font-weight:600;
    border:1px dashed rgba(52,211,153,.4);border-radius:12px;background:rgba(52,211,153,.06);
  }

  /* Net positions */
  .net{
    display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;
    padding:12px 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;
  }
  .net:last-child{margin-bottom:0}
  .net .who{font-weight:600;font-size:15px}
  .net .val{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;text-align:right;
  }
  .net .val.pos{color:var(--good)}
  .net .val.neg{color:var(--bad)}
  .net .val.zero{color:var(--muted)}
  .net .det{
    grid-column:1 / -1;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;
  }

  /* Expenses */
  .exp{
    padding:14px 16px;border:1px solid var(--line);border-radius:12px;
    background:var(--bg-2);margin-bottom:10px;
  }
  .exp:last-child{margin-bottom:0}
  .exp-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
  .exp-payer{font-weight:600;font-size:15px}
  .exp-payer .verb{color:var(--muted);font-weight:400}
  .exp-amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
  .exp-note{color:var(--text);font-size:14px;margin-bottom:8px}
  .exp-note:empty{display:none}
  .exp-split{color:var(--muted);font-size:12.5px;line-height:1.55}
  .exp-split .label{color:var(--muted-2);margin-right:4px}
  .exp-split .name{color:var(--text)}
  .exp-split .share{color:var(--muted);font-variant-numeric:tabular-nums}

  /* Empty state */
  .empty{
    text-align:center;padding:40px 22px;color:var(--muted);
  }
  .empty h2{margin:0 0 8px;color:var(--text);font-size:20px;font-weight:700;letter-spacing:-.01em}
  .empty p{margin:0 0 18px;font-size:14px;line-height:1.6}
  .empty code{
    display:block;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;color:var(--text);font-size:13px;text-align:left;
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    margin:14px 0 0;white-space:pre-wrap;line-height:1.5;
  }

  .footer{margin-top:30px;color:var(--muted-2);font-size:12px;text-align:center}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--bg-3);border:1px solid var(--line);
    color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width: 480px){
    .title h1{font-size:19px}
    .card-head{padding:16px 16px 4px}
    .card-body{padding:8px 16px 16px}
    .transfer{padding:12px 14px}
    .transfer .who{font-size:14px}
    .transfer .amt{font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <!-- rendered by JS -->
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Decode state from URL hash ---------- */
function decodeHash(){
  const h = location.hash.replace(/^#/,'');
  if (!h) return null;
  try {
    const b64 = h.replace(/-/g,'+').replace(/_/g,'/');
    const padded = b64 + '==='.slice((b64.length+3)%4);
    const json = decodeURIComponent(escape(atob(padded)));
    return JSON.parse(json);
  } catch(e){ return null; }
}

/* ---------- Settlement (port of settle.py) ---------- */
function round2(x){ return Math.round(x * 100) / 100; }

function compute(state){
  const people = state.p || [];
  const balances = {}, paid = {}, owed = {};
  people.forEach(p => { balances[p]=0; paid[p]=0; owed[p]=0; });

  for (const e of (state.e || [])){
    const payer = e.a;
    const amount = +e.m;
    if (!people.includes(payer) || !isFinite(amount) || amount <= 0) continue;
    const group = e.g === "all" ? people.slice()
                : (Array.isArray(e.g) ? e.g.filter(n => people.includes(n)) : []);
    if (!group.length) continue;
    const shares = Array.isArray(e.s) && e.s.length === group.length
                 ? e.s.map(x => +x || 0)
                 : group.map(() => 1);
    const total = shares.reduce((a,b)=>a+b, 0);
    if (total <= 0) continue;

    paid[payer] += amount;
    balances[payer] += amount;
    group.forEach((p,i) => {
      const portion = amount * shares[i] / total;
      balances[p] -= portion;
      owed[p] += portion;
    });
  }
  return { balances, paid, owed };
}

function settle(state, balances){
  const bal = { ...balances };
  const raw = []; const eps = 0.005;
  const N = (state.p || []).length;
  let safety = N * N + 20;
  while (safety-- > 0){
    let cr = null, db = null, mx = -Infinity, mn = Infinity;
    for (const p of Object.keys(bal)){
      if (bal[p] > mx){ mx = bal[p]; cr = p; }
      if (bal[p] < mn){ mn = bal[p]; db = p; }
    }
    if (cr == null || db == null) break;
    if (bal[cr] <= eps && bal[db] >= -eps) break;
    const amt = Math.min(bal[cr], -bal[db]);
    if (amt <= eps) break;
    raw.push([db, cr, amt]);
    bal[cr] -= amt; bal[db] += amt;
  }
  const transfers = raw.map(([f,t,a]) => [f, t, round2(a)]);
  if (transfers.length){
    const delta = {}; (state.p||[]).forEach(p => delta[p] = 0);
    for (const [f,t,a] of transfers){ delta[f] -= a; delta[t] += a; }
    for (const p of (state.p||[])){
      const drift = (balances[p] || 0) - delta[p];
      if (Math.abs(drift) >= 0.005){
        for (let i=0;i<transfers.length;i++){
          const [f,t,a] = transfers[i];
          if (t === p){ transfers[i] = [f,t,round2(a + drift)]; delta[f] -= drift; delta[t] += drift; break; }
          if (f === p){ transfers[i] = [f,t,round2(a - drift)]; delta[f] += drift; delta[t] -= drift; break; }
        }
      }
    }
  }
  return transfers;
}

/* ---------- Format ---------- */
function fmt(n){ return n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtInt(n){
  return Math.abs(n - Math.round(n)) < 0.005
    ? Math.round(n).toLocaleString()
    : fmt(n);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- Render ---------- */
function render(state){
  const app = document.getElementById("app");
  if (!state || !state.p || !state.p.length){
    app.innerHTML = renderEmpty();
    return;
  }
  const cur = state.c ? " " + state.c : "";
  const title = state.t || "Settlement";
  const people = state.p;

  const { balances, paid, owed } = compute(state);
  const transfers = settle(state, balances);

  // Hero
  let html = `
    <header class="hero">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 38c6 9 30 9 36 0" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
            <circle cx="22" cy="24" r="3" fill="white"/>
            <circle cx="42" cy="24" r="3" fill="white"/>
          </svg>
        </div>
        <div class="title">
          <h1>${esc(title)}</h1>
          <div class="sub">${esc(people.join(" · "))}</div>
        </div>
      </div>
      <button class="btn primary" id="btn-share" aria-label="Share">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Share
      </button>
    </header>
  `;

  // Settlement card
  const everyoneOnce = people.every(p =>
    transfers.filter(t => t[0]===p).length <= 1 &&
    transfers.filter(t => t[1]===p).length <= 1
  );
  html += `
    <section class="card settle-card">
      <div class="card-head">
        <h2>Settlement</h2>
        <span class="meta">${transfers.length} ${transfers.length===1?"transfer":"transfers"}</span>
      </div>
      <div class="card-body">
  `;
  if (transfers.length === 0){
    html += `<div class="all-even">Everyone's even. No transfers needed.</div>`;
  } else {
    html += `<div class="transfers">`;
    for (const [f,t,a] of transfers){
      html += `
        <div class="transfer">
          <div class="flow">
            <span class="who">${esc(f)}</span>
            <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg></span>
            <span class="who">${esc(t)}</span>
          </div>
          <span class="amt">${fmtInt(a)}${esc(cur)}</span>
        </div>
      `;
    }
    html += `</div>`;
    html += `<div class="settle-note">${
      everyoneOnce
        ? "Each person moves money at most once."
        : "Some people appear in more than one transfer — balances don't partition cleanly."
    }</div>`;
  }
  html += `</div></section>`;

  // Net positions
  html += `
    <section class="card">
      <div class="card-head">
        <h2>Net positions</h2>
        <span class="meta">${people.length} ${people.length===1?"person":"people"}</span>
      </div>
      <div class="card-body">
  `;
  for (const p of people){
    const net = round2(balances[p] || 0);
    const cls = net > 0.005 ? "pos" : (net < -0.005 ? "neg" : "zero");
    const sign = net > 0.005 ? "+" : (net < -0.005 ? "−" : "");
    html += `
      <div class="net">
        <span class="who">${esc(p)}</span>
        <span class="val ${cls}">${sign}${fmtInt(Math.abs(net))}${esc(cur)}</span>
        <span class="det">paid ${fmtInt(paid[p] || 0)} · owes ${fmtInt(owed[p] || 0)}</span>
      </div>
    `;
  }
  html += `</div></section>`;

  // Expenses
  const expenses = state.e || [];
  if (expenses.length){
    html += `
      <section class="card">
        <div class="card-head">
          <h2>Who paid for what</h2>
          <span class="meta">${expenses.length} ${expenses.length===1?"expense":"expenses"}</span>
        </div>
        <div class="card-body">
    `;
    for (const e of expenses){
      const amt = +e.m || 0;
      const group = e.g === "all" ? people.slice() : (Array.isArray(e.g) ? e.g : []);
      const shares = Array.isArray(e.s) && e.s.length === group.length ? e.s : null;
      let splitText;
      if (e.g === "all"){
        splitText = `<span class="label">Split:</span> everyone (${group.length})`;
      } else if (group.length === people.length){
        splitText = `<span class="label">Split:</span> everyone`;
      } else if (group.length === 0){
        splitText = `<span class="label">Split:</span> —`;
      } else {
        const parts = group.map((n,i) => {
          const sh = shares ? +shares[i] : 1;
          return `<span class="name">${esc(n)}</span>${shares && shares.some(x=>x!==shares[0]) ? `<span class="share"> (${fmtInt(sh)})</span>` : ""}`;
        });
        splitText = `<span class="label">Split:</span> ${parts.join(", ")}`;
      }
      html += `
        <div class="exp">
          <div class="exp-top">
            <span class="exp-payer"><strong>${esc(e.a)}</strong> <span class="verb">paid</span></span>
            <span class="exp-amt">${fmtInt(amt)}${esc(cur)}</span>
          </div>
          ${e.n ? `<div class="exp-note">${esc(e.n)}</div>` : ""}
          <div class="exp-split">${splitText}</div>
        </div>
      `;
    }
    html += `</div></section>`;
  }

  html += `<div class="footer">Built with claude · share the link, settle the bill.</div>`;

  app.innerHTML = html;
  document.getElementById("btn-share").addEventListener("click", shareLink);
}

function renderEmpty(){
  return `
    <header class="hero">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 38c6 9 30 9 36 0" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
            <circle cx="22" cy="24" r="3" fill="white"/>
            <circle cx="42" cy="24" r="3" fill="white"/>
          </svg>
        </div>
        <div class="title">
          <h1>splitwise</h1>
          <div class="sub">Settle group expenses with one shareable link.</div>
        </div>
      </div>
    </header>
    <section class="card">
      <div class="card-body">
        <div class="empty">
          <h2>No bill to show yet</h2>
          <p>This page is a read-only dashboard. Ask Claude to settle a bill and it'll hand you back a link that lands here, ready to share.</p>
          <p style="color:var(--muted);font-size:13px">Try saying:</p>
          <code>Win paid 300, Sam paid 300, Boy didn't pay, Andrew paid 500 but only him and Boy ate. Settle it.</code>
        </div>
      </div>
    </section>
  `;
}

/* ---------- Share ---------- */
function buildShareText(state){
  if (!state) return "";
  const cur = state.c ? " " + state.c : "";
  const { balances } = compute(state);
  const transfers = settle(state, balances);
  const lines = [];
  lines.push(state.t || "Settlement");
  lines.push("");
  if (transfers.length === 0){
    lines.push("Everyone's even — no transfers needed.");
  } else {
    for (const [f,t,a] of transfers){
      lines.push(`• ${f} → ${t}: ${fmtInt(a)}${cur}`);
    }
  }
  return lines.join("\n");
}

async function shareLink(){
  const url = location.href;
  const text = buildShareText(window.__state);
  const data = {
    title: window.__state?.t || "Splitwise settlement",
    text: text + "\n\nFull breakdown:",
    url,
  };
  if (navigator.share){
    try { await navigator.share(data); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    toast("Link copied");
  } catch(e){
    const ta = document.createElement("textarea");
    ta.value = url; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast("Link copied");
  }
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 1700);
}

/* ---------- Boot ---------- */
const state = decodeHash();
window.__state = state;
render(state);
window.addEventListener("hashchange", ()=>{
  window.__state = decodeHash();
  render(window.__state);
});
</script>
</body>
</html>
