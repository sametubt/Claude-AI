<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Expense ledger</title>
<meta name="color-scheme" content="light only" />
<meta name="theme-color" content="#faf6ea" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23faf6ea'/%3E%3Cpath d='M16 14 L48 14 L48 50 L32 42 L16 50 Z M22 24 L42 24 M22 32 L36 32' fill='none' stroke='%231a1813' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
<style>
  :root{
    --paper:#faf6ea;
    --ink:#1a1813;
    --muted:#6b6457;
    --rule:#d8cdb4;
    --soft:#efe7d3;
  }
  *{box-sizing:border-box}
  html{color-scheme:light only}
  html,body{margin:0;padding:0;background:var(--paper)}
  body{
    font-family:'Geist','Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;
    background:
      radial-gradient(800px 600px at 50% -10%, rgba(216,205,180,.25), transparent 60%),
      var(--paper);
    min-height:100vh;
  }
  .page{
    max-width:440px;margin:0 auto;
    padding:
      max(14px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(40px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));
  }
  /* Phone status bar */
  .status{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Geist Mono','SF Mono',ui-monospace,monospace;
    font-size:11px;letter-spacing:.04em;color:var(--ink);
    padding:4px 4px 22px;
  }
  .status .dots{display:inline-flex;gap:3px}
  .status .dots i{display:inline-block;width:4px;height:4px;border-radius:999px;background:var(--ink)}
  /* Title block */
  .header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
    padding:0 0 16px;border-bottom:1px solid var(--rule);margin-bottom:20px;
  }
  .title{
    font-family:'Geist','Inter',ui-sans-serif,system-ui,sans-serif;
    font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em;
  }
  .date{
    font-family:'Geist Mono',ui-monospace,monospace;
    font-size:10.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;padding-bottom:3px;
  }
  /* Section heads */
  .section{margin-bottom:24px}
  .section-head{
    display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:baseline;
    padding:2px 2px 12px;
  }
  .section-head .name{font-size:14px;font-weight:600;letter-spacing:-.005em}
  .section-head .count{
    font-family:'Geist Mono',monospace;font-size:10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .section-head .lead{
    height:1px;background:repeating-linear-gradient(to right, var(--rule) 0 2px, transparent 2px 5px);
    align-self:center;
  }
  .section-head .total{font-family:'Geist Mono',monospace;font-size:13px;font-weight:600}

  /* Transfer rows */
  .transfer{
    display:grid;
    grid-template-columns:26px 1fr auto 1fr 26px auto;
    column-gap:8px;align-items:center;
    padding:11px 4px;border-bottom:1px solid var(--rule);
    font-size:13.5px;
  }
  .transfer:last-child{border-bottom:none}
  .avatar{
    width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;
    font-family:'Geist Mono',monospace;font-size:9.5px;font-weight:600;
    letter-spacing:.04em;flex-shrink:0;
  }
  .transfer .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .transfer .name.right{text-align:right}
  .transfer .arrow{color:var(--muted);font-family:'Geist Mono',monospace;font-size:14px;padding:0 2px}
  .transfer .amt{
    font-family:'Geist Mono',monospace;font-size:13.5px;font-weight:600;
    text-align:right;white-space:nowrap;padding-left:8px;
  }
  .transfer.even .arrow{color:var(--muted)}
  .transfer.even .even-tag{
    font-family:'Instrument Serif',Georgia,serif;font-style:italic;color:var(--muted);
    font-size:13.5px;text-align:right;
  }
  .transfer.even .amt{color:var(--muted)}

  /* Line items */
  .item{
    display:grid;grid-template-columns:38px 1fr;gap:14px;
    padding:14px 4px;border-bottom:1px solid var(--rule);
  }
  .item:last-child{border-bottom:none}
  .item .icon{
    width:38px;height:38px;border:1.2px solid var(--ink);border-radius:50%;
    display:grid;place-items:center;background:transparent;
  }
  .item .icon svg{width:22px;height:22px;display:block}
  .item .body{display:flex;flex-direction:column;gap:5px;min-width:0}
  .item .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item .item-name{
    font-size:14.5px;font-weight:600;letter-spacing:-.005em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .item .item-amt{
    font-family:'Geist Mono',monospace;font-size:14px;font-weight:600;
    white-space:nowrap;
  }
  .item .meta{font-size:11.5px;color:var(--muted);line-height:1.5}
  .item .meta strong{color:var(--ink);font-weight:500}
  .item .meta .mono{font-family:'Geist Mono',monospace}
  .item .meta-shares{
    font-size:10.5px;color:var(--muted);line-height:1.5;
    font-family:'Geist Mono',monospace;opacity:.85;
  }

  /* Footer */
  .footer{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);
    color:var(--muted);font-family:'Geist Mono',monospace;
    font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  }
  .share-btn{
    appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    font:inherit;font-family:'Geist Mono',monospace;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.1em;
    padding:8px 14px;border-radius:999px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    display:inline-flex;align-items:center;gap:6px;min-height:36px;
  }
  .share-btn:active{transform:translateY(1px)}
  .share-btn svg{width:11px;height:11px}

  /* Empty state */
  .empty{text-align:center;padding:50px 16px 30px;color:var(--muted)}
  .empty h2{
    font-family:'Geist','Inter',ui-sans-serif,system-ui,sans-serif;
    font-weight:700;color:var(--ink);font-size:24px;letter-spacing:-.02em;margin:0 0 10px;
  }
  .empty p{font-size:13px;line-height:1.55;margin:0 0 18px;max-width:340px;margin-left:auto;margin-right:auto}
  .empty code{
    display:block;font-family:'Geist Mono',monospace;font-size:11.5px;
    background:var(--soft);border:1px solid var(--rule);border-radius:6px;
    padding:14px 16px;text-align:left;color:var(--ink);
    white-space:pre-wrap;line-height:1.55;
  }

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);
    padding:10px 18px;border-radius:999px;font-size:11.5px;
    font-family:'Geist Mono',monospace;text-transform:uppercase;letter-spacing:.08em;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:50;
    box-shadow:0 8px 30px -8px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width: 380px){
    .title{font-size:26px}
    .transfer{grid-template-columns:24px 1fr auto 1fr 24px auto;font-size:13px}
    .avatar{width:24px;height:24px;font-size:9px}
  }
</style>
</head>
<body>
<div class="page" id="page"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="splitwise.js"></script>
<script>
(() => {
  // Paper-toned palette. Index 0 (inverted black) goes to the top creditor.
  const PALETTES = [
    ['#1a1813','#faf6ea'],
    ['#cfd9ce','#1d3d23'],
    ['#dfd2e3','#3e2750'],
    ['#dfe1bf','#3b401d'],
    ['#f0d7c4','#5b2e15'],
    ['#ecc9bb','#5b2916'],
    ['#cdd9e6','#22384e'],
    ['#f3e3a8','#5a4709'],
    ['#dfe1bf','#3b401d'],
  ];

  function initials(name){
    const parts = String(name).trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function fmtAmt(n, currency){
    const abs = Math.abs(n);
    const display = abs.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
    if (currency === 'THB' || currency === '฿' || currency === 'baht') return '฿' + display;
    if (currency === 'USD' || currency === '$') return '$' + display;
    if (currency === 'EUR' || currency === '€') return '€' + display;
    if (currency === 'GBP' || currency === '£') return '£' + display;
    if (currency === 'JPY' || currency === '¥') return '¥' + display;
    if (currency) return currency + ' ' + display;
    return display;
  }
  function fmtDate(d){
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
  }
  function fmtTime(d){
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  // Icon library (paper-line aesthetic, all stroke #1a1813 width 1.4)
  const ICONS = {
    receipt: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 3 L17 3 L17 19 L11 16 L5 19 Z"/><line x1="7" y1="8" x2="15" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/></g></svg>`,
    plate: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round"><line x1="7" y1="3" x2="7" y2="19"/><path d="M5 3 L5 8 Q7 10 9 8 L9 3"/><path d="M14 3 Q13 5 13 7 Q13 9 14.5 10 L14.5 19"/></g></svg>`,
    noodle: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round"><path d="M3 6 q 8 -4 16 0"/><path d="M3 11 q 8 -4 16 0"/><path d="M3 16 q 8 -4 16 0"/></g></svg>`,
    bowl: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round"><rect x="4" y="6" width="14" height="12" rx="2"/><line x1="3" y1="6" x2="19" y2="6"/><line x1="7" y1="3" x2="7" y2="6"/><line x1="15" y1="3" x2="15" y2="6"/></g></svg>`,
    soup: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round"><path d="M3 17 q 8 3 16 0"/><path d="M6 8 q 0 -3 2 -3 q 2 0 2 3 q 0 3 2 3 q 2 0 2 -3"/></g></svg>`,
    bottle: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round"><path d="M8 4 L14 4 L14 7 L15 9 L15 17 q 0 1 -1 1 L8 18 q -1 0 -1 -1 L7 9 L8 7 Z"/></g></svg>`,
    glass: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round"><path d="M5 4 L7 18 L15 18 L17 4 Z"/><line x1="6" y1="9" x2="16" y2="9"/></g></svg>`,
    cup: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8 L17 8 L16 17 q -1 1 -2 1 L8 18 q -1 0 -2 -1 Z"/><path d="M17 10 q 2 0 2 2 q 0 2 -2 2"/><path d="M9 4 q 1 -1 0 -2"/><path d="M13 4 q 1 -1 0 -2"/></g></svg>`,
    car: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round"><rect x="3" y="9" width="16" height="6" rx="1.5"/><circle cx="7" cy="19" r="1.8"/><circle cx="15" cy="19" r="1.8"/><line x1="6" y1="6" x2="16" y2="6"/></g></svg>`,
    bed: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 L3 11 L19 11 L19 17"/><line x1="3" y1="17" x2="19" y2="17"/><path d="M5 11 L5 8 L17 8 L17 11"/><circle cx="8" cy="9.5" r="1"/></g></svg>`,
    ticket: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round"><path d="M3 8 L3 6 L19 6 L19 8 a 2 2 0 0 0 0 6 L19 16 L3 16 L3 14 a 2 2 0 0 0 0 -6 Z"/><line x1="11" y1="6" x2="11" y2="16" stroke-dasharray="1 2"/></g></svg>`,
    dessert: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="11" cy="7" r="4"/><path d="M7 9 L11 19 L15 9"/></g></svg>`,
    bag: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8 L17 8 L16 18 L6 18 Z"/><path d="M8 8 V6 a3 3 0 0 1 6 0 V8"/></g></svg>`,
    rent: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11 L11 5 L18 11 L18 18 L4 18 Z"/><rect x="9" y="13" width="4" height="5"/></g></svg>`,
    bill: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="6" width="16" height="11" rx="0.5"/><path d="M3 7 L11 13 L19 7"/></g></svg>`,
    tip: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="8" y1="14" x2="14" y2="8"/><circle cx="9" cy="9" r="0.9"/><circle cx="13" cy="13" r="0.9"/></g></svg>`,
    money: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="6" width="16" height="10" rx="1"/><circle cx="11" cy="11" r="2.4"/></g></svg>`,
    golf: `<svg viewBox="0 0 22 22"><g fill="none" stroke="#1a1813" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="3" x2="8" y2="18"/><path d="M8 4 L15 6 L8 8 Z" fill="#1a1813"/><circle cx="8" cy="19" r="1.4"/></g></svg>`,
  };
  function iconFor(text){
    const k = (text || '').toLowerCase();
    // Golf goes first — "greens fees", "tee time" otherwise get caught by /fee/ or /tip/.
    if (/\bgolf|\btee\b|fairway|greens? fee|caddy|country club|driving range|18 holes?|\bbuggy\b/.test(k)) return ICONS.golf;
    if (/whisk|bottle|liquor|vodka|tequila|gin|rum|champagne/.test(k))    return ICONS.bottle;
    if (/beer|wine|drink|booze|cocktail|round\b|bar\b/.test(k))           return ICONS.glass;
    if (/coffee|tea|latte|cappuccino|espresso|cafe/.test(k))              return ICONS.cup;
    if (/curry|rice|bowl/.test(k))                                        return ICONS.bowl;
    if (/noodle|pad thai|pasta|spaghetti|ramen|pho/.test(k))              return ICONS.noodle;
    if (/soup|tom yum|broth|stew/.test(k))                                return ICONS.soup;
    if (/dinner|lunch|breakfast|meal|food|appetiz|starter|main|burger|pizza|sushi|steak|chicken/.test(k)) return ICONS.plate;
    if (/dessert|cake|sweet|ice cream|mango|chocolate/.test(k))           return ICONS.dessert;
    if (/taxi|tuk|uber|grab|lyft|cab|ride|train|bus|flight|airport|transport|\bgas\b|petrol|fuel|parking|toll/.test(k)) return ICONS.car;
    if (/hotel|airbnb|room|stay|accommodation|hostel/.test(k))            return ICONS.bed;
    if (/ticket|concert|movie|show|entry|admission|museum|\btour\b|excursion|\bguide\b|cover charge|\bktv\b|karaoke|nightclub|club night/.test(k)) return ICONS.ticket;
    if (/groc|market|\bshop|store|souvenir|cleaning|housekeep|snack|7-?11|convenience|\bmart\b/.test(k)) return ICONS.bag;
    if (/\brent\b|\blease\b|mortgage|\bdeposit\b/.test(k))                return ICONS.rent;
    if (/wifi|internet|electric|electricity|water bill|utilit|netflix|spotify|hulu|\bhbo\b|subscription|\bsim card|esim|roaming|data plan|phone bill|cable bill/.test(k)) return ICONS.bill;
    if (/tip|service|fee|tax|gratuity/.test(k))                           return ICONS.tip;
    if (/cash|paid|payment|loan/.test(k))                                 return ICONS.money;
    return ICONS.receipt;
  }

  function render(bill){
    const page = document.getElementById('page');
    if (!bill || !bill.people.length){
      page.innerHTML = renderEmpty();
      return;
    }
    const now = new Date();
    const totalSpend = bill.expenses.reduce((s,e) => s + (+e.amount || 0), 0);
    const totalSettle = bill.transfers.reduce((s,t) => s + Math.abs(t.amount), 0);

    // Assign palette by net balance: top creditor → inverted black, then rotate.
    const sortedByCredit = bill.people.slice().sort((a,b) =>
      (bill.balances[b]||0) - (bill.balances[a]||0)
    );
    const paletteMap = {};
    sortedByCredit.forEach((p, i) => { paletteMap[p] = PALETTES[i % PALETTES.length]; });

    // People not in any transfer are "even"
    const inTransfers = new Set();
    bill.transfers.forEach(t => { inTransfers.add(t.from); inTransfers.add(t.to); });
    const even = bill.people.filter(p => !inTransfers.has(p));

    let html = '';
    // Phone status bar
    html += `
      <div class="status">
        <span>${fmtTime(now)}</span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>
    `;
    // Header
    html += `
      <div class="header">
        <div class="title">${esc(bill.title || 'Expense ledger')}</div>
        <div class="date">${fmtDate(now).toUpperCase()}</div>
      </div>
    `;

    // Settlement section
    html += `
      <section class="section">
        <div class="section-head">
          <span class="name">Settlement</span>
          <span class="count">${bill.transfers.length} ${bill.transfers.length===1?'transfer':'transfers'}</span>
          <span class="lead"></span>
          <span class="total">${fmtAmt(totalSettle, bill.currency)}</span>
        </div>
    `;
    if (bill.transfers.length === 0 && bill.people.length){
      html += `
        <div class="transfer even">
          <span></span>
          <span class="name">all settled</span>
          <span class="arrow">—</span>
          <span class="even-tag">no transfers needed</span>
          <span></span>
          <span class="amt">${fmtAmt(0, bill.currency)}</span>
        </div>
      `;
    } else {
      for (const t of bill.transfers){
        const [fbg, ffg] = paletteMap[t.from] || PALETTES[0];
        const [tbg, tfg] = paletteMap[t.to]   || PALETTES[0];
        html += `
          <div class="transfer">
            <div class="avatar" style="background:${fbg};color:${ffg}" title="${esc(t.from)}">${initials(t.from)}</div>
            <span class="name">${esc(t.from)}</span>
            <span class="arrow">→</span>
            <span class="name right">${esc(t.to)}</span>
            <div class="avatar" style="background:${tbg};color:${tfg}" title="${esc(t.to)}">${initials(t.to)}</div>
            <span class="amt">${fmtAmt(t.amount, bill.currency)}</span>
          </div>
        `;
      }
      for (const p of even){
        const [bg, fg] = paletteMap[p] || PALETTES[0];
        html += `
          <div class="transfer even">
            <div class="avatar" style="background:${bg};color:${fg}" title="${esc(p)}">${initials(p)}</div>
            <span class="name">${esc(p)}</span>
            <span class="arrow">—</span>
            <span class="even-tag">even</span>
            <span></span>
            <span class="amt">${fmtAmt(0, bill.currency)}</span>
          </div>
        `;
      }
    }
    html += `</section>`;

    // Line items section
    if (bill.expenses.length){
      html += `
        <section class="section">
          <div class="section-head">
            <span class="name">Line items</span>
            <span class="count">${bill.expenses.length} ${bill.expenses.length===1?'item':'items'}</span>
            <span class="lead"></span>
            <span class="total">${fmtAmt(totalSpend, bill.currency)}</span>
          </div>
      `;
      for (const e of bill.expenses){
        const group = e.group === 'all'
          ? bill.people.slice()
          : (Array.isArray(e.group) ? e.group : []);
        const splitLabel = (e.group === 'all' || group.length === bill.people.length)
          ? `all ${bill.people.length}`
          : group.join(', ');
        let perEa = '';
        let breakdown = '';
        if (group.length){
          if (!Array.isArray(e.shares)){
            perEa = ` · <span class="mono">${fmtAmt(e.amount / group.length, bill.currency)}</span> ea`;
          } else {
            const min = Math.min(...e.shares), max = Math.max(...e.shares);
            // Treat as equal when shares only differ by rounding noise
            // (≤2% spread, e.g. [507,507,507,507,506,506] for 3040/6).
            const isRoundingOnly = min > 0 && max / min <= 1.02;
            if (min === max || isRoundingOnly){
              perEa = ` · <span class="mono">${fmtAmt(e.amount / group.length, bill.currency)}</span> ea`;
            } else {
              const totalShares = e.shares.reduce((a,b) => a + b, 0);
              if (totalShares > 0){
                breakdown = group.map((p, i) =>
                  `${esc(p)} ${fmtAmt(e.amount * e.shares[i] / totalShares, bill.currency)}`
                ).join(' · ');
              }
            }
          }
        }
        const itemName = e.note || `${e.payer}'s payment`;
        html += `
          <div class="item">
            <div class="icon">${iconFor(e.note + ' ' + e.payer)}</div>
            <div class="body">
              <div class="row1">
                <span class="item-name">${esc(itemName)}</span>
                <span class="item-amt">${fmtAmt(e.amount, bill.currency)}</span>
              </div>
              <div class="meta">paid <strong>${esc(e.payer)}</strong> · split <strong>${esc(splitLabel)}</strong>${perEa}</div>
              ${breakdown ? `<div class="meta-shares">${breakdown}</div>` : ''}
            </div>
          </div>
        `;
      }
      html += `</section>`;
    }

    html += `
      <div class="footer">
        <span></span>
        <button class="share-btn" id="share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Share
        </button>
      </div>
    `;

    page.innerHTML = html;
    document.getElementById('share').addEventListener('click', share);
  }

  function renderEmpty(){
    return `
      <div class="status">
        <span>${fmtTime(new Date())}</span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>
      <div class="header">
        <div class="title">Expense ledger</div>
        <div class="date">DRAFT</div>
      </div>
      <div class="empty">
        <h2>No bill loaded</h2>
        <p>Ask Claude to settle a bill — it'll hand you a link that opens this ledger filled in. Try:</p>
        <code>Win paid 300, Sam paid 300, Boy didn't pay,
Andrew paid 500 but only him and Boy ate.
Settle it.</code>
      </div>
    `;
  }

  async function share(){
    const url = location.href;
    const bill = window.__bill;
    const lines = (bill && bill.transfers.length)
      ? bill.transfers.map(t => `• ${t.from} → ${t.to}: ${fmtAmt(t.amount, bill.currency)}`)
      : ['No transfers needed.'];
    const text = [bill?.title || 'Expense ledger', '', ...lines, '', 'Full breakdown:'].join('\n');
    if (navigator.share){
      try { await navigator.share({title: bill?.title || 'Splitwise', text, url}); return; }
      catch(e){ if (e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = url; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast('Link copied');
    }
  }
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 1700);
  }

  const bill = Splitwise.load();
  window.__bill = bill;
  render(bill);
  window.addEventListener('hashchange', () => {
    window.__bill = Splitwise.load();
    render(window.__bill);
  });
})();
</script>
</body>
</html>
